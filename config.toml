base_url = "http://127.0.0.1:1111"
title = "Broadside"
description = "A blog about software, security, and the craft of building things"
theme = "broadside"
compile_sass = true
generate_feeds = true
feed_filenames = ["rss.xml"]

# Class-based highlighting (giallo, Zola >= 0.22): the theme ships its own
# palette in sass/_syntax.scss targeting the emitted .z-* classes, so the
# giallo-*.css files Zola generates into static/ are unused — don't link or
# commit them. A theme choice is required by Zola even in class mode.
[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

# `categories` is the primary taxonomy: the first one listed becomes the
# kicker above the headline and the section label in lists. `tags` is
# optional — omit it and the theme simply renders nothing for it.
# Per-term feeds at /categories/<term>/rss.xml. The theme's Subscribe
# dropdown lists every term of every taxonomy with feed = true.
[[taxonomies]]
name = "categories"
feed = true

[[taxonomies]]
name = "tags"

# Series membership. Leave feed off — a per-series feed would put every
# series in the header's Subscribe menu.
[[taxonomies]]
name = "series"

[extra]
author = "Elena Larsson"
# author_url = "https://example.com/about"
# default_og_image = "og-default.png"
# publisher_logo = "logo.png"
# twitter_handle = "@broadside"
# verification_links = [
#   "https://mastodon.social/@example",
#   "https://github.com/example",
# ]
nav_links = [
  { name = "Essays", url = "/essays" },
  { name = "Notes", url = "/notes" },
  { name = "About", url = "/about" },
]

# AI transparency. Every string below has a built-in English default, so the
# whole block is optional — declaring [extra.ai_transparency] at all is what
# switches the feature on. The postures (none / assisted / edited / generated)
# follow the seams of EU AI Act Art. 50; see the README.
[extra.ai_transparency]
default_text = "none"
# Set true to label posts with no AI involvement too. Worth the extra line:
# if only AI-touched posts carry a label, an unlabelled post is ambiguous
# between "written by hand" and "the author forgot".
show_when_none = true
# The named person or entity holding editorial responsibility — the condition
# the Art. 50(4) exception is granted against. Falls back to the post author,
# then the site author.
editorial_responsibility = "Elena Larsson"
policy_url = "/about"
policy_label = "How we use AI"
